<!doctype html>
<meta charset="utf-8" />
<title>Parent OAuth (PKCE) → Streamlit Child</title>
<style>
  body { font-family: system-ui, Segoe UI, Arial; margin: 24px; }
  label { display:block; margin: 8px 0 4px; }
  input, button { padding: 8px; }
  iframe { width: 100%; height: 70vh; border: 1px solid #e5e7eb; }
  pre { background:#f8fafc; padding:8px; border:1px solid #e5e7eb; }
  .row { display:flex; gap:12px; align-items:center; }
</style>

<h2>Parent OAuth (PKCE) → Streamlit Child</h2>

<div class="row">
  <button id="login">Sign in (Snowflake OAuth)</button>
  <button id="signout" style="margin-left:8px;">Sign out</button>
  <span id="miniStatus" style="margin-left:12px; color:#64748b;"></span>

</div>

<details style="margin:8px 0 6px 0;">
  <summary>Dev options</summary>
  <label style="margin-top:8px;">Child URL</label>
  <input id="childUrl" style="width:100%" value="http://localhost:8501/"/>
  <div style="font-size:12px; color:#64748b; margin-top:4px;">Only adjust for local testing.</div>
  <div style="height:8px"></div>
  <button id="resend" style="margin-right:8px;">Resend code to child</button>
  <div style="height:8px"></div>

</details>

<label>Status</label>
<pre id="status"></pre>

<iframe id="child" src="" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>

<script>

const cfg = {
  accountUrl: 'https://wa31964.us-east-2.aws.snowflakecomputing.com', // no path, no trailing slash
  clientId: 'BGJxYRrwWw7bcdjEptdCyCDICbQ=',
  // Redirect back to THIS page so we can handle the code here
  redirectUri: 'http://localhost:8000/parent/index.html',
  scope: 'SESSION:ROLE:DBA',
  childOrigin: null,
};

const ls = {
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); },
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); } catch{ return null; } },
  del(k){ localStorage.removeItem(k); }
};

const KEYS = { VERIFIER: 'parent_cv' };

function status(msg){ document.getElementById('status').textContent = msg; }
function b64url(a){ return btoa(String.fromCharCode.apply(null,new Uint8Array(a))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
async function genVerifier(){ const arr = new Uint8Array(64); crypto.getRandomValues(arr); return Array.from(arr).map(x=>('0'+x.toString(16)).slice(-2)).join(''); }
async function challengeFrom(v){ const enc=new TextEncoder().encode(v); const dig=await crypto.subtle.digest('SHA-256',enc); return b64url(dig); }

function buildAuthorizeUrl(challenge){
  const url = new URL(cfg.accountUrl.replace(/\/$/, '') + '/oauth/authorize');
  url.searchParams.set('response_type','code');
  url.searchParams.set('client_id', cfg.clientId);
  url.searchParams.set('redirect_uri', cfg.redirectUri);
  url.searchParams.set('scope', cfg.scope);
  url.searchParams.set('code_challenge', challenge);
  url.searchParams.set('code_challenge_method','S256');
  url.searchParams.set('state', crypto.randomUUID());
  return url.toString();
}

// Note: parent no longer exchanges or sends tokens; child exchanges server-side using URL params.

document.getElementById('login').onclick = async ()=>{
  try{
    const v = await genVerifier(); ls.set(KEYS.VERIFIER, v);
    const cc = await challengeFrom(v);
    window.location.assign(buildAuthorizeUrl(cc));
  }catch(e){ status('Login error: '+e); }
};

document.getElementById('resend').onclick = ()=>{
  const f = document.getElementById('child');
  try { f.src = f.src; status('Resent code to child'); } catch(e) {}
};
document.getElementById('signout').onclick = ()=>{
  ls.del(KEYS.VERIFIER);
  status('Signed out.');
  document.getElementById('miniStatus').textContent = '';
};

// Handle callback
(async function(){
  const u = new URL(window.location.href);
  const code = u.searchParams.get('code');
  const savedCode = code || null;
  const savedVerifier = ls.get(KEYS.VERIFIER);

  // Initialize iframe first so messages are delivered to the right context
  const childUrl = document.getElementById('childUrl').value;
  const frame = document.getElementById('child');
  // If we already have a code, pass it via iframe URL so the child can read via st.query_params
  if(savedCode){
    try{
      const u2 = new URL(childUrl);
      u2.searchParams.set('p_code', savedCode);
      if(savedVerifier) u2.searchParams.set('p_cv', savedVerifier);
      u2.searchParams.set('p_cid', cfg.clientId);
      u2.searchParams.set('p_ruri', cfg.redirectUri);
      u2.searchParams.set('p_acc', cfg.accountUrl);
      frame.src = u2.toString();
    }catch{ frame.src = childUrl; }
  } else {
    frame.src = childUrl;
  }
  try{ cfg.childOrigin = new URL(childUrl).origin; }catch{}

  function sendCodeToChild(){ status('Auth code sent to child for exchange'); }

  if(savedCode){
    // Clear code from parent URL for a clean state
    frame.addEventListener('load', () => setTimeout(sendCodeToChild, 50), { once: true });
    history.replaceState({}, document.title, '/parent/index.html');
  }

  // No message listener or token refresh in parent; child handles refresh.
})();
</script>
